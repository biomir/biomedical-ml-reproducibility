[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biomedical-ml-reproducibility"
version = "0.2.0"
description = "Reference utilities for reproducible biomedical ML experiments."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Yonathan Emmanuel"}]
license = {text = "MIT"}
dependencies = []

[project.urls]
Homepage = "https://github.com/biomir"
Repository = "https://github.com/biomir/biomedical-ml-reproducibility"

[project.optional-dependencies]
test = ["pytest>=8"]
ml = ["numpy>=1.24", "scikit-learn>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
